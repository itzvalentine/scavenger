<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scavenger</title>
<meta name="description" content="Scavenger: look at old tech, AI finds what's worth saving and designs it a new 3D-printed body. Concept prototype for Meta Quest.">
<style>
  :root {
    --cyan: #00e5ff;
    --bg: #0b0f17;
    --text: #e8eef7;
    --muted: #8a97ab;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #title { position: absolute; top: 16px; left: 16px; right: 16px; }
  #title h1 { margin: 0; font-size: 22px; letter-spacing: 0.14em; color: var(--cyan); }
  #title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 420px; }
  #controls { position: absolute; left: 0; right: 0; bottom: 84px; display: flex; flex-direction: column;
    align-items: center; gap: 10px; padding: 0 16px; }
  #steps { display: flex; gap: 6px; }
  #steps span { width: 28px; height: 4px; border-radius: 2px; background: #2a3445; transition: background .3s; }
  #steps span.on { background: var(--cyan); }
  #next { pointer-events: auto; border: 1px solid var(--cyan); background: rgba(0,229,255,0.12); color: var(--text);
    font: 600 15px system-ui, sans-serif; padding: 10px 22px; border-radius: 999px; cursor: pointer; }
  #next:hover { background: rgba(0,229,255,0.25); }
  #hint { font-size: 12px; color: var(--muted); text-align: center; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <div id="title">
    <h1>◆ SCAVENGER</h1>
    <p>Look at old tech. AI finds what's worth saving, designs it a new body, and sends it to your 3D printer. Concept prototype.</p>
  </div>
  <div id="controls">
    <div id="steps"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <button id="next">Scan ▶</button>
    <div id="hint">On Meta Quest: tap START AR, look at an object, pinch to go to the next step.</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Demo script. Change these through the URL so you don't have to edit code, e.g.
// ?device=Game%20Boy&parts=Screen,Buttons,Speaker,!Battery%20Door&build=Handheld%20Retro%20Console
// A part starting with "!" is shown as broken. Add &auto to play hands-free.
// ---------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
const CONFIG = {
  device: q.get('device') || 'Portable Radio',
  era: q.get('era') || 'c. 1998',
  condition: q.get('condition') || 'Cracked casing · Dead tuner',
  parts: (q.get('parts') || 'Speaker 3W,Li-ion Battery,Volume Knob,Antenna,!Tuner Board,!Front Casing')
    .split(',').map(s => s.trim()).filter(Boolean)
    .map(s => s.startsWith('!') ? { name: s.slice(1), ok: false } : { name: s, ok: true }),
  build: q.get('build') || 'Retro Bluetooth Speaker',
  brain: q.get('brain') || 'ESP32',
  printTime: q.get('time') || '3h 12m',
  size: parseFloat(q.get('size')) || 0.22,   // size of the scanned object, in meters
  auto: q.has('auto'),
};
const OK_PARTS = CONFIG.parts.filter(p => p.ok);

const CYAN = '#00e5ff', GREEN = '#3dff8b', RED = '#ff4d5e', ORANGE = '#ffb347';
const S = CONFIG.size;

// States
const IDLE = 0, SCAN = 1, RESULTS = 2, DESIGN = 3, PRINT = 4, DONE = 5;
const STEP_NAMES = ['READY', 'SCANNING', 'ANALYSIS', 'AI DESIGN', 'FABRICATE', 'COMPLETE'];
const BUTTON_TEXT = ['Scan ▶', 'Scanning…', 'Design something new ▶', 'Send to printer ▶', 'Printing…', 'Scan again ↺'];

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DESKTOP_BG = new THREE.Color(0x0b0f17);
scene.background = DESKTOP_BG;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, S * 0.5, 0);
function frameDesktopCamera() {
  const a = innerWidth / innerHeight;
  // Fit the whole layout (panel on the left, new build on the right) in view
  const dist = Math.max(1.25, 0.8 / (Math.tan(THREE.MathUtils.degToRad(25)) * a));
  camera.position.set(-0.12, S * 0.5 + 0.3 * dist, dist);
  controls.target.set(-0.13, S * 0.5, 0);
  controls.update();
}
frameDesktopCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 2, 1.5);
scene.add(sun);

// Desktop-only stage
const desktopStage = new THREE.Group();
const grid = new THREE.GridHelper(3, 30, 0x1d3a4a, 0x141c28);
desktopStage.add(grid);
scene.add(desktopStage);

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const clamp01 = t => Math.min(1, Math.max(0, t));

function roundedRectShape(x, y, w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Sound: small synth blips, created on first user gesture
let audio = null;
function initAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === 'suspended') audio.resume();
}
function blip(freq = 880, dur = 0.08, type = 'sine', vol = 0.06) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}
function chord(freqs, dur = 0.5) { freqs.forEach((f, i) => setTimeout(() => blip(f, dur, 'triangle', 0.05), i * 70)); }
addEventListener('pointerdown', initAudio);
addEventListener('keydown', initAudio);

// ---------------------------------------------------------------------------
// Scan root: everything placed around the real object. Local +Z faces the viewer.
// ---------------------------------------------------------------------------
const scanRoot = new THREE.Group();
scene.add(scanRoot);

// Stand-in "broken radio" for the desktop preview (hidden in AR, the real object is there)
const standIn = new THREE.Group();
{
  const beige = new THREE.MeshStandardMaterial({ color: 0xb9ab8f, roughness: 0.8 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
  const metal = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, metalness: 0.8, roughness: 0.35 });
  const w = S * 0.95, h = S * 0.58, d = S * 0.34;
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), beige);
  body.position.y = h / 2; body.rotation.z = 0.02;
  standIn.add(body);
  const grille = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.32, h * 0.32, 0.004, 32), dark);
  grille.rotation.x = Math.PI / 2; grille.position.set(-w * 0.22, h * 0.5, d / 2 + 0.002);
  standIn.add(grille);
  const dial = new THREE.Mesh(new THREE.BoxGeometry(w * 0.32, h * 0.16, 0.004), dark);
  dial.position.set(w * 0.22, h * 0.7, d / 2 + 0.002);
  standIn.add(dial);
  const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.012, 16), dark);
  knob.rotation.x = Math.PI / 2; knob.position.set(w * 0.3, h * 0.32, d / 2 + 0.006);
  standIn.add(knob);
  // crack
  const crackPts = [[-0.48, 0.95], [-0.3, 0.7], [-0.36, 0.5], [-0.15, 0.3], [-0.2, 0.08]]
    .map(([x, y]) => new THREE.Vector3(x * w + w * 0.5 - w * 0.05, y * h, d / 2 + 0.0035));
  const crack = new THREE.Line(new THREE.BufferGeometry().setFromPoints(crackPts),
    new THREE.LineBasicMaterial({ color: 0x111111 }));
  standIn.add(crack);
  // bent antenna
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, S * 0.7, 8), metal);
  ant.position.set(w * 0.4 - 0.05, h + S * 0.25, -d * 0.3); ant.rotation.z = -0.9;
  standIn.add(ant);
}
scanRoot.add(standIn);

// Scan brackets (corner brackets around the object)
const brackets = (() => {
  const hw = S * 0.6, top = S * 1.05, L = S * 0.18, pts = [];
  for (const x of [-hw, hw]) for (const y of [0, top]) for (const z of [-hw, hw]) {
    const sx = -Math.sign(x), sy = y === 0 ? 1 : -1, sz = -Math.sign(z);
    pts.push(x, y, z, x + sx * L, y, z);
    pts.push(x, y, z, x, y + sy * L, z);
    pts.push(x, y, z, x, y, z + sz * L);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: CYAN, transparent: true }));
})();
scanRoot.add(brackets);

// Sweep plane
const sweep = new THREE.Group();
{
  const size = S * 1.2;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({
    color: CYAN, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  plane.rotation.x = -Math.PI / 2;
  sweep.add(plane);
  const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-size / 2, 0, -size / 2), new THREE.Vector3(size / 2, 0, -size / 2),
    new THREE.Vector3(size / 2, 0, size / 2), new THREE.Vector3(-size / 2, 0, size / 2)]),
    new THREE.LineBasicMaterial({ color: CYAN }));
  sweep.add(edge);
}
scanRoot.add(sweep);

// Point cloud on the object's surface
const cloud = (() => {
  const n = 500, pos = new Float32Array(n * 3), hw = S * 0.5;
  for (let i = 0; i < n; i++) {
    const face = Math.floor(Math.random() * 5);
    let x = (Math.random() - 0.5) * 2 * hw, y = Math.random() * S * 0.65, z = (Math.random() - 0.5) * 2 * hw * 0.4;
    if (face === 0) z = hw * 0.4; else if (face === 1) x = hw; else if (face === 2) x = -hw; else if (face === 3) y = S * 0.65;
    pos.set([x, y, z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: CYAN, size: 0.0035, transparent: true, opacity: 0, depthWrite: false }));
})();
scanRoot.add(cloud);

// Part labels
function makeLabelTexture(text, ok) {
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = '600 44px system-ui, -apple-system, sans-serif';
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  c.width = Math.ceil(tw + 130); c.height = 84;
  ctx.font = font;
  ctx.fillStyle = 'rgba(8,14,24,0.85)'; rr(ctx, 2, 2, c.width - 4, c.height - 4, 38); ctx.fill();
  ctx.strokeStyle = ok ? GREEN : RED; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = ok ? GREEN : RED;
  ctx.font = '700 44px system-ui, sans-serif';
  ctx.fillText(ok ? '✓' : '✕', 26, 58);
  ctx.font = font; ctx.fillStyle = '#ffffff';
  ctx.fillText(text, 80, 57);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return { tex, aspect: c.width / c.height };
}
const labels = CONFIG.parts.map((p, i) => {
  const { tex, aspect } = makeLabelTexture(p.name, p.ok);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  const h = 0.032;
  sprite.userData.baseScale = new THREE.Vector2(h * aspect, h);
  sprite.renderOrder = 10;
  const side = i % 2 === 0 ? -1 : 1, row = Math.floor(i / 2);
  sprite.position.set(side * (S * 0.6 + 0.02 + h * aspect / 2), S * 0.25 + row * 0.05, S * 0.35);
  const anchor = new THREE.Vector3(side * S * (0.12 + Math.random() * 0.3), S * (0.12 + Math.random() * 0.4), S * 0.18);
  const lineEnd = sprite.position.clone().add(new THREE.Vector3(-side * h * aspect / 2, 0, 0));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([anchor, lineEnd]),
    new THREE.LineBasicMaterial({ color: p.ok ? GREEN : RED, transparent: true, depthTest: false }));
  line.renderOrder = 9;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.0035, 10, 10), new THREE.MeshBasicMaterial({ color: p.ok ? GREEN : RED, depthTest: false }));
  dot.position.copy(anchor); dot.renderOrder = 9;
  const g = new THREE.Group();
  g.add(sprite, line, dot);
  scanRoot.add(g);
  return { group: g, sprite, line, dot, anchor, part: p };
});

// ---------------------------------------------------------------------------
// The new build: a procedural retro speaker. Each part has a hologram + solid mesh.
// ---------------------------------------------------------------------------
const solidClip = new THREE.Plane(new THREE.Vector3(0, -1, 0), -1000); // keeps y <= h
const holoClip = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1000);    // keeps y >= h
const holoMat = new THREE.MeshBasicMaterial({ color: CYAN, wireframe: true, transparent: true, opacity: 0.55,
  depthWrite: false, clippingPlanes: [holoClip] });
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, clippingPlanes: [solidClip], ...extra });
const M = {
  shell: mat(0xff6b35),
  dark: mat(0x1d2330, { roughness: 0.8 }),
  light: mat(0xeeeeee, { roughness: 0.3 }),
  screen: mat(0x002a33, { emissive: 0x00e5ff, emissiveIntensity: 0.9 }),
};

const buildRoot = new THREE.Group();   // positioned next to the object
const build = new THREE.Group();        // spins
buildRoot.add(build);
scanRoot.add(buildRoot);
const buildParts = [];
function addPart(geo, material, pos, rot = [0, 0, 0]) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, material), new THREE.Mesh(geo, holoMat));
  g.position.set(...pos); g.rotation.set(...rot);
  g.userData.home = g.position.clone();
  const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.6 + 0.2, Math.random() - 0.5).normalize();
  g.userData.from = g.position.clone().addScaledVector(dir, 0.22);
  build.add(g); buildParts.push(g);
  return g;
}
{
  const W = 0.2, H = 0.12, D = 0.075, FEET = 0.008, front = D / 2;
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(-W / 2, 0, W, H, 0.022), { depth: D, bevelEnabled: false, curveSegments: 8 });
  bodyGeo.translate(0, 0, -D / 2);
  addPart(new THREE.BoxGeometry(0.035, FEET, 0.055), M.dark, [-W * 0.32, FEET / 2, 0]);
  addPart(new THREE.BoxGeometry(0.035, FEET, 0.055), M.dark, [W * 0.32, FEET / 2, 0]);
  addPart(bodyGeo, M.shell, [0, FEET, 0]);
  addPart(new THREE.BoxGeometry(W * 0.9, H * 0.78, 0.004), M.dark, [0, FEET + H * 0.5, front + 0.002]);
  addPart(new THREE.CylinderGeometry(0.04, 0.04, 0.006, 40), M.dark, [-0.045, FEET + H * 0.5, front + 0.006], [Math.PI / 2, 0, 0]);
  addPart(new THREE.TorusGeometry(0.03, 0.0022, 8, 40), M.shell, [-0.045, FEET + H * 0.5, front + 0.009]);
  addPart(new THREE.TorusGeometry(0.017, 0.0022, 8, 32), M.shell, [-0.045, FEET + H * 0.5, front + 0.009]);
  addPart(new THREE.PlaneGeometry(0.065, 0.026), M.screen, [0.048, FEET + H * 0.68, front + 0.0045]);
  addPart(new THREE.CylinderGeometry(0.011, 0.011, 0.014, 24), M.light, [0.03, FEET + H * 0.3, front + 0.009], [Math.PI / 2, 0, 0]);
  addPart(new THREE.CylinderGeometry(0.011, 0.011, 0.014, 24), M.light, [0.066, FEET + H * 0.3, front + 0.009], [Math.PI / 2, 0, 0]);
  addPart(new THREE.TorusGeometry(0.065, 0.0065, 10, 32, Math.PI), M.dark, [0, FEET + H - 0.006, 0]);
  addPart(new THREE.CylinderGeometry(0.0025, 0.0025, 0.13, 8), M.light, [W * 0.4, FEET + H + 0.055, -D * 0.25], [0, 0, -0.35]);
}
buildRoot.position.set(S * 0.6 + 0.3, 0, 0.03);
buildRoot.rotation.y = -0.6;

// "Transfer beams" from the salvaged parts to the new build
const beams = labels.filter(l => l.part.ok).map(l => {
  const end = buildRoot.position.clone().add(new THREE.Vector3(0, 0.07, 0));
  const mid = l.anchor.clone().lerp(end, 0.5); mid.y += 0.12;
  const pts = new THREE.QuadraticBezierCurve3(l.anchor, mid, end).getPoints(60);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: GREEN, transparent: true, opacity: 0.8, depthTest: false }));
  line.renderOrder = 8;
  scanRoot.add(line);
  return line;
});

// Printer nozzle + glowing layer
const nozzle = new THREE.Group();
{
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.008, 0.02, 16), new THREE.MeshStandardMaterial({ color: 0xc0c6cf, metalness: 0.8, roughness: 0.3 }));
  cone.rotation.x = Math.PI; cone.position.y = 0.012;
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.004, 12, 12), new THREE.MeshBasicMaterial({ color: ORANGE }));
  nozzle.add(cone, glow);
}
const layer = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
  color: ORANGE, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
layer.rotation.x = -Math.PI / 2;
scene.add(nozzle, layer);

// Celebration sparkles
const sparkles = (() => {
  const n = 160, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: GREEN, size: 0.006, transparent: true, opacity: 0, depthWrite: false }));
  pts.userData.vel = Array.from({ length: n }, () => new THREE.Vector3((Math.random() - 0.5) * 0.6, Math.random() * 0.7 + 0.2, (Math.random() - 0.5) * 0.6));
  return pts;
})();
buildRoot.add(sparkles);

// ---------------------------------------------------------------------------
// Info panel (canvas texture)
// ---------------------------------------------------------------------------
const panelCanvas = document.createElement('canvas');
panelCanvas.width = 1024; panelCanvas.height = 680;
const pctx = panelCanvas.getContext('2d');
const panelTex = new THREE.CanvasTexture(panelCanvas);
panelTex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.42 * 680 / 1024),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
panel.renderOrder = 11;
scene.add(panel);
const PANEL_LOCAL = new THREE.Vector3(-(S * 0.6 + 0.5), S * 0.5 + 0.12, 0.02);

const FIRMWARE = [
  '> compiling scavenger-firmware.bin',
  `> flashing ${CONFIG.brain} … 100%`,
  '> speaker: OK   battery: OK   bluetooth: OK',
  '✓ firmware installed',
];

function drawPanel() {
  const c = pctx, W = panelCanvas.width, H = panelCanvas.height, P = 56;
  c.clearRect(0, 0, W, H);
  c.fillStyle = 'rgba(8,14,24,0.86)'; rr(c, 6, 6, W - 12, H - 12, 40); c.fill();
  c.strokeStyle = 'rgba(0,229,255,0.85)'; c.lineWidth = 5; c.stroke();
  c.textBaseline = 'alphabetic';
  c.font = '800 38px system-ui, sans-serif'; c.fillStyle = CYAN; c.textAlign = 'left';
  c.fillText('◆ SCAVENGER', P, 84);
  c.font = '600 26px system-ui, sans-serif'; c.fillStyle = 'rgba(255,255,255,0.55)'; c.textAlign = 'right';
  c.fillText(`${state + 1}/6 · ${STEP_NAMES[state]}`, W - P, 84);
  c.textAlign = 'left';
  c.fillStyle = 'rgba(0,229,255,0.25)'; c.fillRect(P, 110, W - P * 2, 2);

  const big = (t, y, color = '#fff', size = 64) => { c.font = `800 ${size}px system-ui, sans-serif`; c.fillStyle = color; c.fillText(t, P, y); };
  const line = (t, y, color = '#c9d4e3', size = 34, weight = 500) => { c.font = `${weight} ${size}px system-ui, sans-serif`; c.fillStyle = color; c.fillText(t, P, y); };
  const bar = (p, y, color = CYAN) => {
    c.fillStyle = 'rgba(255,255,255,0.1)'; rr(c, P, y, W - P * 2, 22, 11); c.fill();
    c.fillStyle = color; rr(c, P, y, Math.max(22, (W - P * 2) * p), 22, 11); c.fill();
  };
  const footer = t => { c.font = '600 30px system-ui, sans-serif'; c.fillStyle = CYAN; c.fillText(t, P, H - 50); };

  const t = stateTime;
  if (state === IDLE) {
    big('Look at old tech.', 210);
    line('AI finds what is still good inside,', 290);
    line('then designs it a brand-new body.', 340);
    footer('👌 Pinch to scan');
  } else if (state === SCAN) {
    const p = clamp01(t / SCAN_TIME);
    big('Scanning…', 200, CYAN);
    const tasks = ['Mapping shape', 'Identifying components', 'Checking condition'];
    tasks.forEach((task, i) => {
      const done = p > (i + 1) / 3.3;
      line(`${done ? '✓' : '○'}  ${task}`, 290 + i * 56, done ? GREEN : '#c9d4e3');
    });
    bar(p, 500);
    line(`${Math.round(p * 100)}%`, 590, '#fff', 34, 700);
  } else if (state === RESULTS) {
    big(CONFIG.device, 196, '#fff', 60);
    line(`${CONFIG.era}  ·  ${CONFIG.condition}`, 250, ORANGE, 30, 600);
    const shown = labelsShown();
    CONFIG.parts.forEach((p, i) => {
      if (i >= shown) return;
      const col = i % 2, row = Math.floor(i / 2);
      c.font = '600 32px system-ui, sans-serif';
      c.fillStyle = p.ok ? GREEN : RED;
      c.fillText(p.ok ? '✓' : '✕', P + col * 450, 330 + row * 56);
      c.fillStyle = '#fff';
      c.fillText(p.name, P + 44 + col * 450, 330 + row * 56);
    });
    footer(`${OK_PARTS.length} parts worth saving  ·  👌 Pinch to design`);
  } else if (state === DESIGN) {
    const p = clamp01(t / DESIGN_TIME);
    line('AI CONCEPT', 172, CYAN, 28, 700);
    big(CONFIG.build, 240, '#fff', 56);
    line(`Reuses: ${OK_PARTS.slice(0, 3).map(x => x.name).join(', ')}`, 312, '#c9d4e3', 30);
    line(`Adds: ${CONFIG.brain} board + 3D-printed shell`, 360, '#c9d4e3', 30);
    line(p < 1 ? 'Generating 3D model…' : '✓ Model ready', 450, p < 1 ? '#fff' : GREEN, 32, 700);
    bar(p, 480);
    footer(p < 1 ? '' : `Print time ${CONFIG.printTime}  ·  👌 Pinch to print`);
  } else if (state === PRINT) {
    const p = clamp01(t / PRINT_TIME);
    line('FABRICATING', 172, ORANGE, 28, 700);
    big(p < 1 ? `Printing shell  ${Math.round(p * 100)}%` : '✓ Shell printed', 240, p < 1 ? '#fff' : GREEN, 54);
    bar(p, 272, ORANGE);
    FIRMWARE.forEach((f, i) => {
      if (t > PRINT_TIME + 0.2 + i * 0.6) {
        c.font = '500 28px ui-monospace, Menlo, Consolas, monospace';
        c.fillStyle = f.startsWith('✓') ? GREEN : '#9fe8ff';
        c.fillText(f, P, 380 + i * 52);
      }
    });
  } else if (state === DONE) {
    big('REBORN ✓', 220, GREEN, 84);
    line(`${CONFIG.device}  →  ${CONFIG.build}`, 300, '#fff', 34, 700);
    line(`${OK_PARTS.length} parts saved from the landfill`, 360);
    line(`Running on ${CONFIG.brain} · custom firmware`, 410);
    footer('👌 Pinch to scan again');
  }
  panelTex.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// State machine
// ---------------------------------------------------------------------------
const SCAN_TIME = 3.6, LABEL_GAP = 0.4, DESIGN_TIME = 2.6, PRINT_TIME = 6.0;
let state = IDLE, stateTime = 0, placed = false, lastLabels = 0;
const labelsShown = () => Math.min(CONFIG.parts.length, Math.floor(stateTime / LABEL_GAP) + 1);

const stepsEl = [...document.querySelectorAll('#steps span')];
const nextBtn = document.getElementById('next');
function updateDom() {
  stepsEl.forEach((s, i) => s.classList.toggle('on', i <= state));
  nextBtn.textContent = BUTTON_TEXT[state];
  nextBtn.disabled = state === SCAN || state === PRINT;
  nextBtn.style.opacity = nextBtn.disabled ? 0.5 : 1;
}

function go(s) {
  state = s; stateTime = 0;
  if (s === IDLE) {
    labels.forEach(l => l.group.visible = false);
    beams.forEach(b => { b.visible = false; b.geometry.setDrawRange(0, 0); });
    buildRoot.visible = false;
    brackets.visible = false; sweep.visible = false; cloud.material.opacity = 0;
    nozzle.visible = false; layer.visible = false; sparkles.material.opacity = 0;
    solidClip.constant = -1000; holoClip.constant = 1000;
    build.rotation.y = 0;
    placed = !renderer.xr.isPresenting;
  }
  if (s === SCAN) { brackets.visible = true; sweep.visible = true; blip(520, 0.15, 'sawtooth', 0.03); }
  if (s === RESULTS) { sweep.visible = false; lastLabels = 0; }
  if (s === DESIGN) {
    buildRoot.visible = true;
    buildParts.forEach(p => { p.position.copy(p.userData.from); p.scale.setScalar(0.001); });
    beams.forEach(b => b.visible = true);
    chord([440, 660, 880]);
  }
  if (s === PRINT) { nozzle.visible = true; layer.visible = true; blip(330, 0.2, 'square', 0.03); }
  if (s === DONE) {
    nozzle.visible = false; layer.visible = false;
    solidClip.constant = 1000; holoClip.constant = -1000;
    const pos = sparkles.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setXYZ(i, 0, 0.07, 0);
    pos.needsUpdate = true;
    sparkles.userData.vel.forEach(v => v.set((Math.random() - 0.5) * 0.6, Math.random() * 0.7 + 0.2, (Math.random() - 0.5) * 0.6));
    chord([523, 659, 784, 1047], 0.6);
  }
  updateDom();
  drawPanel();
}

function advance() {
  initAudio();
  if (state === IDLE) { if (renderer.xr.isPresenting) placeAt(currentTarget()); go(SCAN); }
  else if (state === RESULTS) go(DESIGN);
  else if (state === DESIGN && stateTime > DESIGN_TIME) go(PRINT);
  else if (state === DONE) go(IDLE);
}
nextBtn.addEventListener('click', advance);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); advance(); } });

// ---------------------------------------------------------------------------
// AR: hit testing + placement
// ---------------------------------------------------------------------------
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.03, 0.04, 40).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.9 }));
reticle.matrixAutoUpdate = false; reticle.visible = false;
scene.add(reticle);
let hitTestSource = null, hitPos = null;

const viewerPos = new THREE.Vector3(), viewerDir = new THREE.Vector3();
function updateViewer() {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldPosition(viewerPos);
  cam.getWorldDirection(viewerDir);
}
function currentTarget() {
  if (hitPos) return hitPos.clone();
  // No surface found: put it ~60cm ahead, a bit below eye level
  const d = viewerDir.clone(); d.y = 0; d.normalize();
  return viewerPos.clone().addScaledVector(d, 0.6).add(new THREE.Vector3(0, -0.35, 0));
}
function placeAt(p) {
  scanRoot.position.copy(p);
  const to = viewerPos.clone().sub(p); to.y = 0;
  scanRoot.rotation.set(0, to.lengthSq() > 1e-6 ? Math.atan2(to.x, to.z) : 0, 0);
  placed = true;
}

const arButton = ARButton.createButton(renderer, { optionalFeatures: ['hit-test', 'local-floor', 'hand-tracking'] });
document.body.appendChild(arButton);

renderer.xr.addEventListener('sessionstart', () => {
  initAudio();
  const session = renderer.xr.getSession();
  session.addEventListener('select', advance);
  session.requestReferenceSpace('viewer')
    .then(space => session.requestHitTestSource({ space }))
    .then(src => { hitTestSource = src; })
    .catch(() => { hitTestSource = null; });
  scene.background = null;
  desktopStage.visible = false; standIn.visible = false;
  document.getElementById('ui').style.display = 'none';
  go(IDLE);
});
renderer.xr.addEventListener('sessionend', () => {
  hitTestSource = null; hitPos = null; reticle.visible = false;
  scene.background = DESKTOP_BG;
  desktopStage.visible = true; standIn.visible = true;
  document.getElementById('ui').style.display = '';
  scanRoot.position.set(0, 0, 0); scanRoot.rotation.set(0, 0, 0);
  go(IDLE);
});

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3(), tmpBox = new THREE.Box3(), tmpCenter = new THREE.Vector3(), tmpSize = new THREE.Vector3();
let panelRedraw = 0, autoTimer = 0;

renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  stateTime += dt;
  updateViewer();

  // Hit test (AR)
  if (frame && hitTestSource) {
    const results = frame.getHitTestResults(hitTestSource);
    const ref = renderer.xr.getReferenceSpace();
    if (results.length && ref) {
      const pose = results[0].getPose(ref);
      reticle.matrix.fromArray(pose.transform.matrix);
      hitPos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
    } else hitPos = null;
  }
  reticle.visible = renderer.xr.isPresenting && state === IDLE && !!hitPos;
  scanRoot.visible = placed;

  // Panel placement
  const wantPanel = tmpV;
  if (renderer.xr.isPresenting && state === IDLE) {
    const d = viewerDir.clone(); d.y = 0; d.normalize();
    wantPanel.copy(viewerPos).addScaledVector(d, 0.75).add(new THREE.Vector3(0, -0.12, 0));
  } else {
    wantPanel.copy(PANEL_LOCAL); scanRoot.localToWorld(wantPanel);
  }
  if (panel.userData.init) panel.position.lerp(wantPanel, 1 - Math.pow(0.001, dt));
  else { panel.position.copy(wantPanel); panel.userData.init = true; }
  panel.lookAt(viewerPos.x, panel.position.y, viewerPos.z);

  // Per-state animation
  if (state === SCAN) {
    sweep.position.y = S * 0.55 * (1 - Math.cos(stateTime * 3.2));
    cloud.material.opacity = clamp01(stateTime / 1.5) * 0.9;
    brackets.material.opacity = 0.6 + 0.4 * Math.sin(stateTime * 10);
    if (Math.floor(stateTime * 6) !== Math.floor((stateTime - dt) * 6)) blip(1200 + Math.random() * 400, 0.03, 'sine', 0.02);
    if (stateTime >= SCAN_TIME) { go(RESULTS); }
  } else {
    brackets.material.opacity = 0.7;
  }

  if (state === RESULTS || state === DESIGN || state === PRINT || state === DONE) {
    const shown = state === RESULTS ? labelsShown() : labels.length;
    if (state === RESULTS && shown !== lastLabels) { lastLabels = shown; blip(labels[shown - 1].part.ok ? 990 : 330, 0.09, 'triangle', 0.05); drawPanel(); }
    labels.forEach((l, i) => {
      l.group.visible = i < shown;
      const age = state === RESULTS ? stateTime - i * LABEL_GAP : 10;
      const k = easeOutBack(clamp01(age / 0.35));
      l.sprite.scale.set(l.sprite.userData.baseScale.x * k, l.sprite.userData.baseScale.y * k, 1);
    });
    cloud.material.opacity = Math.max(0, cloud.material.opacity - dt * 0.6);
  }

  if (state === DESIGN) {
    const p = stateTime / DESIGN_TIME;
    buildParts.forEach((part, i) => {
      const k = clamp01((stateTime - i * 0.13) / 0.7);
      part.position.lerpVectors(part.userData.from, part.userData.home, easeOutCubic(k));
      part.scale.setScalar(Math.max(0.001, easeOutBack(k)));
      if (k > 0 && k < 1 && !part.userData.clicked) { part.userData.clicked = true; blip(700 + i * 40, 0.05, 'sine', 0.03); }
      if (k === 0) part.userData.clicked = false;
    });
    beams.forEach(b => b.geometry.setDrawRange(0, Math.floor(61 * clamp01(p * 1.6))));
  }
  if (state === PRINT || state === DONE) {
    beams.forEach(b => { b.material.opacity = Math.max(0, b.material.opacity - dt); });
  } else beams.forEach(b => { b.material.opacity = 0.8; });

  if (state === DESIGN || state === PRINT) build.rotation.y += dt * 0.3;
  if (state === DONE) {
    // Settle facing the viewer, then gently sway
    if (stateTime < dt * 1.5) build.userData.rest = Math.ceil(build.rotation.y / (Math.PI * 2)) * Math.PI * 2;
    const target = build.userData.rest + 0.35 * Math.sin(stateTime * 0.8);
    build.rotation.y += (target - build.rotation.y) * (1 - Math.pow(0.05, dt));
  }

  if (state === PRINT) {
    tmpBox.setFromObject(build); tmpBox.getCenter(tmpCenter); tmpBox.getSize(tmpSize);
    const p = clamp01(stateTime / PRINT_TIME);
    const h = tmpBox.min.y + (tmpBox.max.y - tmpBox.min.y) * p;
    solidClip.constant = h; holoClip.constant = -h;
    const a = stateTime * 9;
    nozzle.position.set(tmpCenter.x + Math.cos(a) * tmpSize.x * 0.42, h + 0.002, tmpCenter.z + Math.sin(a * 1.3) * tmpSize.z * 0.42);
    layer.position.set(tmpCenter.x, h, tmpCenter.z);
    layer.scale.set(tmpSize.x * 1.15, tmpSize.z * 1.15, 1);
    nozzle.visible = layer.visible = p < 1;
    if (p < 1 && Math.floor(stateTime * 4) !== Math.floor((stateTime - dt) * 4)) blip(180, 0.05, 'square', 0.015);
    if (p >= 1) { solidClip.constant = 1000; holoClip.constant = -1000; }
    const lineIdx = Math.floor((stateTime - PRINT_TIME - 0.2) / 0.6);
    if (lineIdx >= 0 && lineIdx !== panel.userData.fw && lineIdx < FIRMWARE.length) { panel.userData.fw = lineIdx; blip(1400, 0.04, 'square', 0.02); }
    if (stateTime > PRINT_TIME + 0.2 + FIRMWARE.length * 0.6 + 0.4) { panel.userData.fw = -1; go(DONE); }
  }

  if (state === DONE) {
    const k = clamp01(stateTime / 1.6);
    sparkles.material.opacity = 1 - k;
    if (k < 1) {
      const pos = sparkles.geometry.attributes.position;
      sparkles.userData.vel.forEach((v, i) => {
        v.y -= dt * 0.9;
        pos.setXYZ(i, pos.getX(i) + v.x * dt * 0.5, pos.getY(i) + v.y * dt * 0.5, pos.getZ(i) + v.z * dt * 0.5);
      });
      pos.needsUpdate = true;
    }
  }

  // Hands-free mode for recording
  if (CONFIG.auto) {
    autoTimer += dt;
    const waits = { [IDLE]: 3, [RESULTS]: CONFIG.parts.length * LABEL_GAP + 2.5, [DESIGN]: DESIGN_TIME + 2.5, [DONE]: 7 };
    if (waits[state] !== undefined && stateTime > waits[state]) advance();
  }

  // Redraw the panel during animated steps (throttled)
  if (state === SCAN || state === PRINT || state === DESIGN) {
    if (++panelRedraw % 3 === 0) drawPanel();
  }

  if (!renderer.xr.isPresenting) controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

go(IDLE);
</script>
</body>
</html>
