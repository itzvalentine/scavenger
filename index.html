<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scavenger</title>
<meta name="description" content="Scavenger: tear down old tech in mixed reality, salvage the good parts, merge them into something new, sculpt a shell and 3D print it.">
<style>
  :root { --accent: #5be7ff; --bg: #0a0d13; --text: #f4f7fb; --dim: rgba(244,247,251,0.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #brand { position: absolute; top: 18px; left: 20px; display: flex; align-items: baseline; gap: 12px; }
  #brand b { font-size: 15px; letter-spacing: 0.28em; color: var(--accent); }
  #brand span { font-size: 12px; color: var(--dim); }
  #hint { position: absolute; bottom: 70px; left: 16px; right: 16px; text-align: center; font-size: 12px; color: var(--dim); }
  #ARButton {
    border-radius: 999px !important; font: 600 12px system-ui, sans-serif !important; letter-spacing: 0.12em !important;
    padding: 12px 24px !important; width: auto !important; left: 50% !important; transform: translateX(-50%);
    bottom: 18px !important; background: rgba(91,231,255,0.12) !important; border: 1px solid rgba(91,231,255,0.6) !important;
  }
  #sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); overflow-y: auto; padding: 20px 20px 32px;
    background: rgba(14,18,26,0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-left: 1px solid rgba(255,255,255,0.1); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); z-index: 10; }
  #sheet.open { transform: none; }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .sheet-head b { display: block; font-size: 20px; }
  .sheet-head span { display: block; font-size: 13px; color: var(--dim); margin-top: 4px; }
  #sheet-close { background: rgba(255,255,255,0.08); border: 0; color: var(--text); width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; flex: none; }
  .group { margin-bottom: 18px; }
  .label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,247,251,0.4); margin-bottom: 8px; font-weight: 700; }
  .row { display: flex; gap: 12px; justify-content: space-between; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); margin-bottom: 8px; }
  .row .name { font-weight: 600; font-size: 15px; }
  .row .name span { font-weight: 400; color: rgba(244,247,251,0.45); font-size: 12px; margin-left: 8px; }
  .row .why { font-size: 13px; color: var(--dim); margin: 4px 0 10px; line-height: 1.4; }
  .stores { display: flex; flex-wrap: wrap; gap: 6px; }
  .stores a { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(91,231,255,0.35); }
  .stores a:hover { background: rgba(91,231,255,0.12); }
  .row .price { font-weight: 700; white-space: nowrap; font-size: 15px; }
  .price.free { color: #4ade80; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 4px; border-top: 1px solid rgba(255,255,255,0.12); }
  .total b { font-size: 26px; }
  .note { font-size: 12px; color: rgba(244,247,251,0.45); line-height: 1.5; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; letter-spacing: 0.2em; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">LOADING SCAVENGER…</div>
<div id="ui">
  <div id="brand"><b>SCAVENGER</b><span>Concept prototype</span></div>
  <div id="hint">Drag empty space to orbit · scroll to zoom · ← → to change steps · On Meta Quest, tap START AR</div>
</div>
<aside id="sheet" aria-label="Shopping list"></aside>
<script type="module">
  import './js/main.js';
  document.getElementById('loading').remove();
</script>
</body>
</html>
